<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#101321" />
  <circle cx="32" cy="32" r="24" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="32" cy="32" r="16" fill="url(#primaryGrad)" fill-opacity="0.15" />
  <!-- Waveform bars -->
  <line x1="16" y1="32" x2="16" y2="32" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" />
  <line x1="22" y1="26" x2="22" y2="38" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" />
  <line x1="28" y1="20" x2="28" y2="44" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="34" y1="16" x2="34" y2="48" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="40" y1="22" x2="40" y2="42" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" />
  <line x1="46" y1="27" x2="46" y2="37" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" />
</svg>
